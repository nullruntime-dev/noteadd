name: noteadd releases
on:
  workflow_dispatch:
  release:
    types: [ created ]
jobs:
  docker-build:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions: 
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU (emulates linux/arm64 on the amd64 runner)
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        buildkitd-config-inline: |
          [registry."${{vars.PRIVATE_DOCKER_REGISTRY_URL}}"]
            http = true
            insecure = true

    - name: Login to local registry
      uses: docker/login-action@v3
      with:
        registry: ${{secrets.PRIVATE_DOCKER_REGISTRY_URL}}
        username: ${{ secrets.PRIVATE_DOCKER_REGISTRY_USERNAME }}
        password: ${{ secrets.PRIVATE_DOCKER_REGISTRY_PASSWORD }}

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        registry: docker.io
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build and push backend image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64
        # Official multi-arch base so the arm64 build has an arm64 FROM image;
        # local builds keep the private-mirror default from the Dockerfile ARG.
        build-args: |
          BASE_IMAGE=node:24.16-alpine
        push: true
        tags: ${{ secrets.DOCKER_HUB_USERNAME }}/noteadd:1.0.5,${{ secrets.DOCKER_HUB_USERNAME }}/noteadd:latest
        cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/noteadd:1.0.5,ref=${{ secrets.DOCKER_HUB_USERNAME }}/noteadd:latest
        cache-to: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/noteadd:1.0.5,ref=${{ secrets.DOCKER_HUB_USERNAME }}/noteadd:latest,mode=max

    
